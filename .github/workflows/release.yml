name: Release

# Obsidian reads releases whose tag is the bare manifest version, such as 1.0.0 (no "v").
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write
  id-token: write
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          node-version: "24"
          cache: true
      - run: vp check
      - run: vp run test
      - run: vp run lint:obsidian
      - run: vp run build
      - name: Check that the tag matches the manifest and package versions
        env:
          RELEASE_VERSION: ${{ github.ref_name }}
        run: |
          node -e '
            const fs = require("node:fs");
            for (const file of ["manifest.json", "package.json"]) {
              const { version } = JSON.parse(fs.readFileSync(file, "utf8"));
              if (version !== process.env.RELEASE_VERSION) throw new Error(`${file} is ${version}, tag is ${process.env.RELEASE_VERSION}`);
            }'
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            main.js
            styles.css
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" main.js manifest.json styles.css --verify-tag --generate-notes --title "Platen $GITHUB_REF_NAME"
